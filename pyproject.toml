[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openpilot-agent"
version = "0.2.0"
description = "A safe local-first AI coding agent"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "OpenPilot Contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
openpilot = "openpilot.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
