[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openpilot-agent"
version = "0.5.0"
description = "Open-source AI content automation and coding agent"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "OpenPilot Contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
media = ["faster-whisper>=1.1"]

[project.scripts]
openpilot = "openpilot.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
